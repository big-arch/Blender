[project]
name = "blender-mcp"
version = "1.0.0"
description = "MCP server that connects an AI assistant to a running Blender instance"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.9.0",
    "pydantic>=2.7.0",
]

[project.scripts]
blender-mcp = "blender_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blender_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["slow: tests that run a real Blender render"]
